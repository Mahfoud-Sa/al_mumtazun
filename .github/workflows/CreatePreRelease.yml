name: Create Pre Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (example: 1.2.0-beta.1)'
        required: true
        type: string

      build_number:
        description: 'Build number'
        required: true
        type: string

jobs:
  prerelease:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: |
          flutter build apk \
            --debug \
            --build-name=${{ inputs.version }} \
            --build-number=${{ inputs.build_number }}

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk \
             app-v${{ inputs.version }}.apk

      - name: Create GitHub Pre Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Pre Release v${{ inputs.version }}
          prerelease: true
          generate_release_notes: true
          files: |
            app-v${{ inputs.version }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-apk
          path: app-v${{ inputs.version }}.apk
