name: Google Play Release

on:
  push:
    branches:
      - main

  # 👇 Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android build)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      # 4. Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Run tests (optional but recommended)
      - name: Run tests
        run: flutter test

      # 6. Build release AAB
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 7. Decode Google Play service account JSON
      - name: Create service account file
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > service-account.json

      # 8. Upload to Google Play
      - name: Upload to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.gidteam.al_mumtazun
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed
