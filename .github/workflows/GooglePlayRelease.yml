name: Google Play Release

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (Android requires it)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Flutter (IMPORTANT: match your project Dart version)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"
          channel: stable
          cache: true

      # 4. Check Flutter version (debug step)
      - name: Show Flutter version
        run: flutter --version

      # 5. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6. Run tests (optional but recommended)
      - name: Run tests
        run: flutter test

      # 7. Build Android App Bundle (AAB)
      - name: Build release AAB
        run: flutter build appbundle --release

      # 8. Create Google Play service account file
      - name: Create service account JSON
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > service-account.json

      # 9. Upload to Google Play (INTERNAL TEST FIRST)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.gidteam.al_mumtazun
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
