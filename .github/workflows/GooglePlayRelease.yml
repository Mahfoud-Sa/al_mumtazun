name: Android Build & Deploy Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.2.0)"
        required: true
        type: string
      build_number:
        description: "Build number (must increase each release)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Print release info
        run: |
          echo "Version: ${{ inputs.version }}"
          echo "Build: ${{ inputs.build_number }}"

      - name: Analyze code
        run: flutter analyze || true

      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ inputs.build_number }}

      - name: Create service account file
        run: |
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > service-account.json

      - name: Deploy to Google Play (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.gidteam.al_mumtazun
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: production
          status: completed

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
