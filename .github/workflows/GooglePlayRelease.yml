name: Google Play Release

on:
  push:
    branches:
      - main

  # Manual trigger button in GitHub Actions
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java (required for Android builds)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Setup Flutter (FIXED - pinned version)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      # 4. Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 5. Run tests (optional but recommended)
      - name: Run tests
        run: flutter test

      # 6. Build release AAB
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 7. Prepare Google Play service account file
      - name: Create service account JSON
        run: echo "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" > service-account.json

      # 8. Upload to Google Play (INTERNAL TEST FIRST RECOMMENDED)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.your.app.package
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
